global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Django API: request/latency/DB metrics plus the FinOps numbers
  # (spend, anomalies, savings, analysis runs) from backend/costs/metrics.py.
  - job_name: cloudcost-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
